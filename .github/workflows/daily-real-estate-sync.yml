name: Daily Real Estate Data Sync

on:
  schedule:
    # 매일 UTC 20:30 = 한국시간(KST) 새벽 05:30 실행
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-real-estate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run real estate data sync script
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/sync-real-estate.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update real estate & subscription json"
            git pull --rebase origin main
            git push
          else
            echo "No changes in public/data/"
          fi
